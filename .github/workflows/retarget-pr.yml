name: Auto Retarget PR to Latest

on:
  pull_request_target:
    types: [opened]

jobs:
  retarget:
    runs-on: ubuntu-latest
    # Only run if someone opens a PR against main, unless it's the 'latest' branch itself
    if: github.base_ref == 'main' && github.head_ref != 'latest'
    steps:
      - name: Retarget PR to latest
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              base: 'latest'
            });
